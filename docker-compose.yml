version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lop_user
      POSTGRES_PASSWORD: lop_password
      POSTGRES_DB: lop_assessment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lop_user -d lop_assessment"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lop_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
